# Песочница для юнитов сканера — ставит ВЛАДЕЛЕЦ сервера руками (docs/VPS_SECURITY.md, шаг 4),
# install_units.sh её не трогает. Копия в /etc/systemd/system/<юнит>.service.d/sandbox.conf для
# accumulation-scanner, scanner-control и scanner-alert. Перед установкой: пользователь scanner
# есть и владеет /opt/scanner и /opt/backups/scanner.
[Service]
User=scanner
Group=scanner
UMask=0077
NoNewPrivileges=yes
ProtectSystem=strict
# писать можно только в каталог сканера и в каталог бэкапов («-» — нет каталога, не ошибка)
ReadWritePaths=/opt/scanner -/opt/backups/scanner
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
LockPersonality=yes
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
